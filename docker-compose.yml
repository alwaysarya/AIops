version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8005:8005"
    environment:
      - JWT_SECRET_KEY=super_secret_opsmind_key_2026
      - DATABASE_URL=aiops.db
    volumes:
      - ./aiops.db:/app/aiops.db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
