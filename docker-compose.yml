version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./services/api-gateway:/app
      - /app/venv
    command: python src/main.py

  ai-detector:
    build: ./services/ai-anomaly-detector
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./services/ai-anomaly-detector:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true

  log-generator:
    build: ./services/api-gateway
    volumes:
      - ./services/api-gateway:/app
    command: python log_generator.py
    depends_on:
      - api-gateway
