version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8081:8000"  # Host port 8081, Container port 8000
    environment:
      - LOG_LEVEL=INFO

  ai-detector:
    build: ./services/ai-anomaly-detector
    ports:
      - "8005:8001"  # Host port 8002, Container port 8001

  frontend:
    build: ./frontend
    ports:
      - "3002:80"    # Host port 3002, Container port 80
    depends_on:
      - api-gateway
