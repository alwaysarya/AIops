name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
    - name: Terraform Init
      run: terraform init
      working-directory: infra/terraform
    - name: Terraform Plan
      run: terraform plan
      working-directory: infra/terraform
