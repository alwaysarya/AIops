name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        cd services/api-gateway
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 services/api-gateway/src --count --select=E9,F63,F7,F82 --show-source --statistics
